name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # 1) Install pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false   # just install pnpm, don't auto-install deps

      # 2) Setup Node and pnpm cache
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 3) Install dependencies with pnpm
      - run: pnpm install --frozen-lockfile

      # 4) Nx commands via pnpm
      - run: pnpm exec nx run-many -t lint test build typecheck
      - run: pnpm exec nx fix-ci
        if: always()
